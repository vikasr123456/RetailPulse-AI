services:
  postgres:
    image: postgres:16-alpine
    container_name: retailpulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: retailpulse
      POSTGRES_USER: retailpulse
      POSTGRES_PASSWORD: retailpulse
    ports:
      - "5432:5432"
    volumes:
      - retailpulse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retailpulse -d retailpulse"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  retailpulse_pgdata:
